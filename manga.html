<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comix.to JSON Exporter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e0e0ff;
      padding: 20px;
      line-height: 1.5;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: #7ee787; margin-bottom: 20px; }
    
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    #urlInput {
      flex: 1;
      min-width: 300px;
      padding: 12px 16px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #1a1a2e;
      color: #fff;
      font-size: 14px;
    }
    #urlInput:focus { outline: 2px solid #7ee787; border-color: transparent; }
    
    button {
      padding: 12px 24px;
      background: #7ee787;
      color: #0f0f1a;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    button:hover { background: #56d364; }
    button:disabled { background: #333; color: #666; cursor: not-allowed; }
    
    #status {
      padding: 10px 16px;
      margin-bottom: 15px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }
    #status.loading { background: #1a1a2e; color: #888; display: block; }
    #status.success { background: #1a2e1a; color: #7ee787; display: block; }
    #status.error { background: #2e1a1a; color: #f85149; display: block; }
    
    #jsonOutput {
      width: 100%;
      min-height: 400px;
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 15px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-all;
      color: #e0e0ff;
      overflow: auto;
      resize: vertical;
    }
    
    .actions {
      display: flex;
      gap: 10px;
      margin: 15px 0;
      flex-wrap: wrap;
    }
    .btn-secondary {
      background: #58a6ff;
      color: #0f0f1a;
    }
    .btn-secondary:hover { background: #388bfd; }
    .btn-danger {
      background: #f85149;
      color: #fff;
    }
    .btn-danger:hover { background: #da3633; }
    
    @media (max-width: 600px) {
      .input-group { flex-direction: column; }
      #urlInput { min-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Comix.to JSON Exporter</h1>
    
    <div class="input-group">
      <input 
        type="text" 
        id="urlInput" 
        placeholder="https://comix.to/title/mjwy-my-first-case-the-corpse-of-my-ex-girlfriend"
        value="https://comix.to/title/mjwy-my-first-case-the-corpse-of-my-ex-girlfriend"
      >
      <button id="fetchBtn" onclick="fetchManga()">🔍 Fetch JSON</button>
    </div>
    
    <div id="status"></div>
    
    <div class="actions" id="actions" style="display:none">
      <button class="btn-secondary" onclick="copyJSON()">📋 Copy JSON</button>
      <button class="btn-secondary" onclick="downloadJSON()">💾 Download .json</button>
      <button class="btn-danger" onclick="clearOutput()">🗑️ Clear</button>
    </div>
    
    <pre id="jsonOutput">// JSON result will appear here...</pre>
  </div>

  <script>
    // ===== CONFIG =====
    const API = {
      BASE: 'https://comix.to/api/v2',
      HEADERS: {
        'Referer': 'https://comix.to/',
        'User-Agent': 'Mozilla/5.0'
      }
    };

    // ===== UTILS =====
    const extractCode = (url) => {
      return url.replace(/\/$/, '').split('/').pop()?.split('-')[0] || '';
    };

    const fetchRetry = async (url, retries = 3) => {
      for (let attempt = 1; attempt <= retries; attempt++) {
        try {
          const res = await fetch(url, { headers: API.HEADERS });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return await res.json();
        } catch (err) {
          if (attempt === retries) throw err;
          await new Promise(r => setTimeout(r, 1000 * attempt));
        }
      }
    };

    // ===== API FUNCTIONS =====
    const getMangaInfo = async (code) => {
      const data = await fetchRetry(`${API.BASE}/manga/${code}/`);
      const r = data.result;
      return {
        manga_id: r.manga_id,
        hash_id: r.hash_id,
        title: r.title || 'Unknown',
        alt_titles: r.alt_titles || [],
        slug: r.slug,
        poster_url: r.poster?.large || r.poster?.medium,
        original_language: r.original_language,
        status: r.status,
        latest_chapter: r.latest_chapter,
        year: r.year,
        genres: r.term_ids || [],
        description: r.synopsis || '',
        is_nsfw: !!r.is_nsfw
      };
    };

    const getAllChapters = async (code) => {
      const allItems = [];
      let page = 1;
      let hasMore = true;

      while (hasMore) {
        const url = `${API.BASE}/manga/${code}/chapters?limit=100&page=${page}&order[number]=asc`;
        const data = await fetchRetry(url);
        const items = data.result?.items || [];
        
        if (!items.length) {
          hasMore = false;
        } else {
          allItems.push(...items);
          hasMore = items.length === 100;
          page++;
        }
        await new Promise(r => setTimeout(r, 100)); // Small delay
      }

      // Simple sort by chapter number (no deduplication)
      return allItems.sort((a, b) => {
        const na = parseFloat(a.number);
        const nb = parseFloat(b.number);
        if (na !== nb) return na - nb;
        return a.number.localeCompare(b.number, undefined, { numeric: true });
      });
    };

    // ===== UI FUNCTIONS =====
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('jsonOutput');
    const actionsEl = document.getElementById('actions');
    const fetchBtn = document.getElementById('fetchBtn');
    const urlInput = document.getElementById('urlInput');

    const showStatus = (msg, type) => {
      statusEl.textContent = msg;
      statusEl.className = type;
    };

    const fetchManga = async () => {
      const url = urlInput.value.trim();
      if (!url.includes('comix.to/title/')) {
        showStatus('❌ Please enter a valid comix.to manga URL', 'error');
        return;
      }

      fetchBtn.disabled = true;
      actionsEl.style.display = 'none';
      outputEl.textContent = 'Loading...';
      showStatus('📥 Fetching manga info...', 'loading');

      try {
        const code = extractCode(url);
        
        // Fetch manga info
        const manga = await getMangaInfo(code);
        showStatus(`📚 Found: ${manga.title} — Fetching chapters...`, 'loading');
        
        // Fetch all chapters (simple, no dedup)
        const chapters = await getAllChapters(code);
        showStatus(`✅ ${chapters.length} chapters fetched`, 'success');
        
        // Build output (simple structure)
        const output = {
          manga: manga,
          chapters: chapters.map(ch => ({
            chapter_id: ch.chapter_id,
            number: ch.number,
            name: ch.name || ch.title || null,
            language: ch.language,
            group: ch.scanlation_group?.name || null,
            created_at: ch.created_at,
            is_official: !!ch.is_official
          })),
          meta: {
            total_chapters: chapters.length,
            exported_at: new Date().toISOString(),
            source_url: url
          }
        };
        
        // Display JSON
        outputEl.textContent = JSON.stringify(output, null, 2);
        actionsEl.style.display = 'flex';
        
      } catch (err) {
        showStatus(`❌ Error: ${err.message}`, 'error');
        outputEl.textContent = `Error: ${err.message}\n\nCheck browser console (F12) for details.`;
        console.error('Fetch error:', err);
      } finally {
        fetchBtn.disabled = false;
      }
    };

    const copyJSON = async () => {
      try {
        await navigator.clipboard.writeText(outputEl.textContent);
        const btn = document.querySelector('.btn-secondary');
        const original = btn.textContent;
        btn.textContent = '✅ Copied!';
        setTimeout(() => btn.textContent = original, 2000);
      } catch (e) {
        alert('Copy failed: ' + e.message);
      }
    };

    const downloadJSON = () => {
      const mangaTitle = (document.getElementById('urlInput').value.match(/title\/[^/]+/)?.[0] || 'manga').replace('title/', '');
      const blob = new Blob([outputEl.textContent], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${mangaTitle}.json`;
      a.click();
      URL.revokeObjectURL(url);
    };

    const clearOutput = () => {
      outputEl.textContent = '// JSON result will appear here...';
      actionsEl.style.display = 'none';
      statusEl.style.display = 'none';
      urlInput.focus();
    };

    // Allow Enter key to trigger fetch
    urlInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') fetchManga();
    });

    // Auto-focus input on load
    window.addEventListener('load', () => urlInput.focus());
  </script>
</body>
</html>
